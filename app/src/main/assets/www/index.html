<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="blizko-ui" content="2026-10-08e">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Близко</title>
<style>
:root{
  --bg:#F6F2EC; --card:#FFFFFF; --card2:#FBF8F4; --ink:#1F1B16; --muted:#7A7065; --line:#E7E0D6;
  --accent:#C2552D; --accent-ink:#FFFFFF; --soft:#F3E3D9; --warn:#B3261E; --ok:#2E8B57;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 4px 14px rgba(60,40,20,.05);
  --serif:Georgia,"Noto Serif","Droid Serif",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16130F; --card:#211D18; --card2:#1B1814; --ink:#EFE8DF; --muted:#A39889; --line:#332C25;
    --accent:#E07A50; --accent-ink:#1A120C; --soft:#3A2A21; --warn:#F2B8B5; --ok:#7FD1A1;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16130F; --card:#211D18; --card2:#1B1814; --ink:#EFE8DF; --muted:#A39889; --line:#332C25;
  --accent:#E07A50; --accent-ink:#1A120C; --soft:#3A2A21; --warn:#F2B8B5; --ok:#7FD1A1;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:Roboto,system-ui,"Segoe UI",sans-serif;font-size:15px;line-height:1.35;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
input,select,textarea{user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
main{padding:8px 16px 160px;max-width:640px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:12px 16px 8px;max-width:640px;margin:0 auto}
header h1{font-family:var(--serif);font-size:24px;font-weight:600;margin:0;flex:1;letter-spacing:-.2px}
.iconbtn{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:active{background:var(--soft)}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);padding:4px 0}
nav button .pill{width:50px;height:30px;border-radius:15px;display:grid;place-items:center}
nav button.on{color:var(--ink);font-weight:600}
nav button.on .pill{background:var(--soft);color:var(--accent)}
.fab{position:fixed;right:18px;bottom:84px;z-index:7;width:58px;height:58px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 18px rgba(150,60,20,.3)}
.fab svg{width:28px;height:28px;stroke-width:2.2}

.hero{padding:6px 2px 14px}
.hero .wd{color:var(--muted);text-transform:capitalize;font-size:14px}
.hero .dm{font-family:var(--serif);font-size:34px;line-height:1.1;margin-top:2px}
.hero .sm{color:var(--muted);margin-top:6px;font-size:14px}

.sec{margin:14px 0 6px}
.sec h2{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:0 2px 8px;display:flex;align-items:center;gap:8px}
.sec h2 .n{font-weight:500;letter-spacing:0}
.sec.warn h2{color:var(--warn)}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:56px;border-top:1px solid var(--line);position:relative}
.row:first-child{border-top:0}
.row:active{background:var(--card2)}
.chk{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--c,var(--muted));display:grid;place-items:center}
.chk.on{background:var(--c,var(--accent));border-color:var(--c,var(--accent))}
.chk.on::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.bar{flex:none;width:4px;align-self:stretch;border-radius:2px;margin:2px 10px 2px 0}
.ico{flex:none;font-size:20px;width:26px;text-align:center}
.txt{flex:1;min-width:0}
.txt .t{font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txt .t.done{text-decoration:line-through;color:var(--muted)}
.txt .m{font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 10px}
.m .late{color:var(--warn)}
.prio{flex:none;font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px}
.p3{background:#F9DEDC;color:#8C1D18}.p2{background:#FCEBC8;color:#7A4A00}.p1{background:#E2EEDC;color:#2F5B1F}
:root[data-theme="dark"] .p3,:root[data-theme="dark"] .p2,:root[data-theme="dark"] .p1{filter:brightness(.85)}
.time{flex:none;width:44px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;background:var(--soft);color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.danger{background:transparent;color:var(--warn)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.tip{background:var(--soft);border-radius:16px;padding:16px;margin:8px 0 4px;font-size:14px;line-height:1.45}
.tip b{font-family:var(--serif);font-size:17px;font-weight:600;display:block;margin-bottom:4px}

/* segmented */
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 10px;border-radius:9px;font-size:13.5px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--soft);color:var(--accent);font-weight:700}

/* calendar */
.calbar{display:flex;align-items:center;gap:6px;margin:4px 0 10px}
.calbar .title{flex:1;font-family:var(--serif);font-size:21px;text-transform:capitalize}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 6px;box-shadow:var(--shadow)}
.grid .wh{font-size:11px;color:var(--muted);text-align:center;padding:2px 0 6px;font-weight:600}
.cell{aspect-ratio:1/1.08;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;font-size:14.5px;font-variant-numeric:tabular-nums}
.cell.o{color:var(--muted);opacity:.5}
.cell.we .num{color:var(--accent)}
.cell.td .num{background:var(--accent);color:var(--accent-ink)!important;border-radius:14px;width:28px;height:28px;display:grid;place-items:center;margin-top:-4px}
.cell.sel{background:var(--soft)}
.dots{display:flex;gap:3px;margin-top:5px;height:6px}
.dots i{width:6px;height:6px;border-radius:3px;display:block}
.dots i.o{border:1.5px solid;background:transparent}
.dots i.o.f{opacity:.45}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week .cell{aspect-ratio:auto;padding:8px 0 10px;background:var(--card);border:1px solid var(--line)}
.week .cell.sel{background:var(--soft);border-color:transparent}
.week .wdl{font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:600}

/* people */
.ava{flex:none;width:42px;height:42px;border-radius:21px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px;background:var(--soft);color:var(--accent)}

/* countdown */
.cd{display:flex;align-items:center;gap:14px;padding:14px;border-top:1px solid var(--line)}
.cd:first-child{border-top:0}
.cd .big{flex:none;width:64px;text-align:center}
.cd .big b{display:block;font-family:var(--serif);font-size:30px;line-height:1;font-weight:600}
.cd .big span{font-size:11px;color:var(--muted)}
.cd .big.now b{color:var(--accent);font-size:20px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,12,6,.42);z-index:20;opacity:0;transition:opacity .18s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;transform:translateY(100%);transition:transform .22s cubic-bezier(.2,.8,.2,1);padding:8px 16px calc(20px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.sheet.show{transform:none}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.shead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.shead h3{flex:1;margin:0;font-family:var(--serif);font-size:21px;font-weight:600}
.fld{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin-bottom:10px}
.fl{display:flex;align-items:center;gap:10px;min-height:48px;border-top:1px solid var(--line)}
.fl:first-child{border-top:0}
.fl>label{flex:1;color:var(--ink);font-size:14.5px}
.fl .hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],textarea{width:100%;border:0;background:transparent;font:inherit;color:var(--ink);outline:none;padding:12px 0}
.title-in{font-size:19px!important;font-weight:500}
input[type=date],input[type=time],select{border:0;background:var(--card2);color:var(--ink);font:inherit;font-size:14.5px;padding:8px 10px;border-radius:10px;outline:none;min-width:0}
input[type=number].small{width:64px;background:var(--card2);border-radius:10px;padding:8px 10px;text-align:center}
textarea{resize:none;min-height:64px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0}
.chip{padding:7px 12px;border-radius:18px;background:var(--card2);border:1px solid var(--line);font-size:13.5px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.sw{width:30px;height:30px;border-radius:15px;border:3px solid transparent}
.sw.on{border-color:var(--ink)}
.emo{width:40px;height:40px;border-radius:12px;font-size:21px;display:grid;place-items:center;background:var(--card2)}
.emo.on{background:var(--soft);outline:2px solid var(--accent)}
.sub{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line)}
.sub:first-child{border-top:0}
.sub input[type=text]{padding:10px 0}
.x{color:var(--muted);font-size:20px;width:32px;height:32px;display:grid;place-items:center}
.actions{display:flex;gap:10px;margin-top:14px}
.actions .btn{flex:1;padding:13px}
.hide{display:none!important}
.f-event .only-task,.f-task .only-event{display:none!important}
.toggle{position:relative;width:46px;height:28px;flex:none}
.toggle input{opacity:0;position:absolute;inset:0;margin:0;z-index:1}
.toggle span{position:absolute;inset:0;border-radius:14px;background:var(--line);transition:.15s}
.toggle span::after{content:"";position:absolute;width:22px;height:22px;border-radius:11px;background:#fff;top:3px;left:3px;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle input:checked+span{background:var(--accent)}
.toggle input:checked+span::after{left:21px}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;opacity:0;transition:.2s;pointer-events:none;max-width:86vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.ask{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.ask .btn{padding:14px}
.muted{color:var(--muted)}
.catedit{padding:8px 14px 6px;border-top:1px solid var(--line);background:var(--card2)}
.catedit:first-child{border-top:0}
.cdot{display:inline-block;width:8px;height:8px;border-radius:4px;margin-right:6px}
.ncf{padding:4px 0 10px}
.ncf-top{display:flex;gap:8px;align-items:center;padding:6px 0}
.ncf-top input{flex:1;min-width:0;background:var(--card2)!important;border-radius:10px!important;padding:9px 10px!important}
.ig-h{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:8px 2px 4px}
.crow{gap:8px;padding:2px 0 4px}
.crow .sw{width:28px;height:28px}
.iconlib{max-height:250px;overflow:auto;border-top:1px solid var(--line);margin-top:6px;padding-right:2px}
.ig{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:4px}
.ig .emo{width:auto;height:38px;font-size:20px}
.iconpick{padding:4px 0 6px;border-top:1px solid var(--line)}
.spend{width:100%;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 10px;box-shadow:var(--shadow);text-align:left}
.sp-l{flex:1;font-size:14px;display:flex;flex-direction:column}
.sp-l i{font-style:normal;font-size:12px;color:var(--muted)}
.spend b{font-family:var(--serif);font-size:20px;font-weight:600}
.sp-a{color:var(--muted);font-size:20px}
.sp-v{flex:none;font-size:15px}
.sp-tot{background:var(--card2)}
.cchip{display:inline-flex;align-items:center;gap:6px;border-color:color-mix(in srgb,var(--cc) 45%,var(--line))}
.cchip .ci{font-size:15px;line-height:1}
.cchip.on{background:var(--cc);border-color:var(--cc);color:#fff}
.catrow{gap:10px}
.cico{width:36px;height:36px;font-size:19px;flex:none}
.iconpick{gap:6px;padding:8px 0 12px;border-top:1px solid var(--line)}
.iconpick .emo{width:36px;height:36px;font-size:19px}
.sub .sdate{display:none;flex:none;width:118px;font-size:12.5px;padding:6px 6px}
#ef.is-goal .sub .sdate{display:block}
.m .goalm{color:var(--accent)}
.uprow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:2px 0 10px}
.up{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:12px;padding:7px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-width:0;box-shadow:var(--shadow)}
.up-n{display:flex;align-items:baseline;gap:3px;line-height:1}
.up-n b{font-family:var(--serif);font-size:22px;font-weight:600}
.up-n b.now{font-size:14px;color:var(--accent);font-family:inherit;padding:4px 0}
.up-n i{font-style:normal;font-size:10.5px;color:var(--muted)}
.up-t{font-size:12px;line-height:1.25;width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;min-height:30px}
.up-d{font-size:10.5px;color:var(--muted)}
.m .moved{color:var(--accent)}
.m .shopm{color:var(--accent);font-weight:600}
.calsw{display:flex;gap:8px;margin-bottom:10px}
.calsw .grow{flex:1}
.calsw .seg button{display:flex;align-items:center;justify-content:center;gap:6px}
.calsw .seg svg{width:18px;height:18px}
.calsw .icons{flex:none}
.calsw .icons button{width:44px;flex:none;padding:7px 0}
.updbar{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:30;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:616px;margin:0 auto}
.updbar span{flex:1}
.chips.mdays{gap:6px}
.chips.mdays .chip{min-width:38px;padding:7px 0;text-align:center}
.chips.mdays .chip[data-d="-1"]{padding:7px 12px}
.chips.mons{gap:6px}
.chips.mons .chip{min-width:48px;text-align:center}
.rep-prev{background:var(--soft);border-radius:12px;padding:10px 12px;margin:4px 0 12px;font-size:13px;line-height:1.45}
.rep-prev:empty{display:none}
.rp-l{font-weight:700;color:var(--accent)}
.rp-d{color:var(--ink);margin-top:2px}
.hab{padding:12px 14px 12px;border-top:1px solid var(--line)}
.hab:first-child{border-top:0}
.hrow{display:flex;align-items:center;gap:12px}
.streak{flex:none;font-weight:700;font-size:14px}
.streak.zero{opacity:.35}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.hd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;border-radius:10px;border:1.5px solid var(--line);font-size:11px;color:var(--muted)}
.hd b{font-size:14px;color:var(--ink);font-weight:600}
.hd.dn{background:var(--c);border-color:var(--c);color:#fff}
.hd.dn b{color:#fff}
.hd.miss{border-style:dashed;border-color:var(--c)}
.hd.off{opacity:.35;border-color:transparent}
.hd.now:not(.dn){border-color:var(--c);border-width:2px}
.pbar{height:6px;border-radius:3px;background:var(--line);margin-top:7px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:3px}
.pct{flex:none;font-weight:700;font-size:14px;min-width:40px;text-align:right}
.goal{align-items:center}
.cat{font-size:11.5px;font-weight:700;color:var(--cc);background:color-mix(in srgb,var(--cc) 15%,transparent);padding:1px 8px;border-radius:8px}
.chip .dot{display:inline-block;width:9px;height:9px;border-radius:5px;margin-right:6px;vertical-align:0}
.chip.on .dot{outline:2px solid var(--accent-ink)}
.catbar{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.catbar::-webkit-scrollbar{display:none}
.catbar .chip{flex:none;white-space:nowrap}
.newcat{display:flex;gap:8px;align-items:center;padding:0 0 10px}
.newcat input{background:var(--card2)!important;border-radius:10px!important;padding:8px 10px!important}
.small{font-size:12.5px}
</style>
</head>
<body>
<header>
  <h1 id="htitle">Сегодня</h1>
  <button class="iconbtn" data-act="settings" aria-label="Настройки"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>
<main id="main"></main>
<button class="fab" data-act="add" aria-label="Добавить"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<nav id="nav"></nav>
<div id="layer"></div>
<div class="toast" id="toast"></div>
<div class="updbar hide" id="updbar"><span>✨ Вышло обновление приложения</span><button class="btn sm pri" data-act="applyupd">Обновить</button></div>

<script>
'use strict';
/* ============ утилиты дат ============ */
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pdate=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(k,n)=>{const d=pdate(k);d.setDate(d.getDate()+n);return dkey(d);};
const diffDays=(a,b)=>Math.round((pdate(b)-pdate(a))/864e5);   // b − a
const today=()=>dkey(new Date());
const dow=k=>(pdate(k).getDay()+6)%7;                             // 0 = понедельник
const dim=(y,m)=>new Date(y,m+1,0).getDate();                      // m с нуля
const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const WDL=['понедельник','вторник','среда','четверг','пятница','суббота','воскресенье'];
const MG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MN=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const plural=(n,f)=>{const a=Math.abs(n)%100,b=a%10;return f[a>10&&a<20?2:b===1?0:b>=2&&b<=4?1:2];};
const dayMonth=k=>{const d=pdate(k);return `${d.getDate()} ${MG[d.getMonth()]}`;};
function relDay(k){
  const t=today(),n=diffDays(t,k);
  if(n===0)return 'сегодня'; if(n===1)return 'завтра'; if(n===-1)return 'вчера';
  const d=pdate(k), s=dayMonth(k)+(d.getFullYear()!==pdate(t).getFullYear()?' '+d.getFullYear():'');
  return n>1&&n<7 ? `${WD[dow(k)].toLowerCase()}, ${s}` : s;
}
const atMs=(k,t)=>{const [y,m,d]=k.split('-').map(Number);const [hh,mm]=(t||'09:00').split(':').map(Number);return new Date(y,m-1,d,hh,mm).getTime();};

/* ============ повторения ============ */
const isRep=it=>!!(it.repeat&&it.repeat.freq&&it.repeat.freq!=='none');
/* ISO-номер недели (как в «чётная/нечётная неделя») */
function isoWeek(k){
  const d=pdate(k);d.setDate(d.getDate()+3-dow(k));
  const y=new Date(d.getFullYear(),0,4);
  return 1+Math.round((Math.round((d-y)/864e5)-3+(y.getDay()+6)%7)/7);
}
const inMonths=(r,d)=>!(r.months&&r.months.length)||r.months.includes(d.getMonth()+1);
function occursOn(it,k){
  if(!it.date||k<it.date)return false;
  if(!isRep(it))return k===it.date;
  const r=it.repeat;
  if(r.until&&k>r.until)return false;
  if(it.skip&&it.skip.includes(k))return false;
  const iv=Math.max(1,parseInt(r.interval)||1), s=pdate(it.date), d=pdate(k);
  if(!inMonths(r,d))return false;
  switch(r.freq){
    case 'daily': return diffDays(it.date,k)%iv===0;
    case 'weekly':{
      const days=(r.days&&r.days.length)?r.days:[dow(it.date)];
      if(!days.includes(dow(k)))return false;
      if(r.par)return (isoWeek(k)%2===0)===(r.par==='even');
      const w=Math.round(diffDays(addDays(it.date,-dow(it.date)),addDays(k,-dow(k)))/7);
      return w%iv===0;
    }
    case 'monthly':{
      const m=(d.getFullYear()-s.getFullYear())*12+d.getMonth()-s.getMonth();
      if(m%iv)return false;
      const L=dim(d.getFullYear(),d.getMonth()), dd=d.getDate();
      if(r.mmode==='nth'){
        const nd=(r.nthDays&&r.nthDays.length)?r.nthDays:[dow(it.date)];
        if(!nd.includes(dow(k)))return false;
        const ns=(r.nth&&r.nth.length)?r.nth:[Math.ceil(s.getDate()/7)];
        return ns.includes(Math.ceil(dd/7))||(dd+7>L&&ns.includes(-1));
      }
      const md=(r.mdays&&r.mdays.length)?r.mdays:[s.getDate()];
      return md.some(x=>x===-1?dd===L:Math.min(x,L)===dd);
    }
    case 'yearly':{
      const y=d.getFullYear()-s.getFullYear();
      if(y%iv||d.getMonth()!==s.getMonth())return false;
      return d.getDate()===Math.min(s.getDate(),dim(d.getFullYear(),d.getMonth()));
    }
  }
  return false;
}
function nextOcc(it,from,undoneOnly){
  if(!it.date)return null;
  let k=from<it.date?it.date:from;
  for(let i=0;i<1500;i++){
    if(isRep(it)&&it.repeat.until&&k>it.repeat.until)return null;
    if(!isRep(it)&&k>it.date)return null;
    if(occursOn(it,k)&&!(undoneOnly&&isDone(it,k)))return k;
    k=addDays(k,1);
  }
  return null;
}

const MS=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const WACC=['понедельник','вторник','среду','четверг','пятницу','субботу','воскресенье'];
const WG=['m','m','f','m','f','f','n'];
const nthSort=a=>a.slice().sort((x,y)=>(x<0?9:x)-(y<0?9:y));
const joinAnd=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' и '+a[a.length-1];
function monthsLabel(ms){
  if(!ms||!ms.length||ms.length===12)return '';
  const a=ms.slice().sort((x,y)=>x-y),runs=[];
  for(const m of a){const r=runs[runs.length-1];if(r&&r[1]===m-1)r[1]=m;else runs.push([m,m]);}
  if(runs.length>1&&runs[0][0]===1&&runs[runs.length-1][1]===12){const f=runs.shift();runs[runs.length-1][1]=f[1]+12;}
  return runs.map(([x,y])=>x===y?MS[x-1]:`${MS[x-1]}–${MS[(y-1)%12]}`).join(', ');
}
function repLabel(r){
  if(!r||r.freq==='none')return '';
  const iv=Math.max(1,parseInt(r.interval)||1);
  const forms={daily:['день','дня','дней'],weekly:['неделю','недели','недель'],monthly:['месяц','месяца','месяцев'],yearly:['год','года','лет']}[r.freq];
  const every=iv===1?{daily:'каждый день',weekly:'каждую неделю',monthly:'каждый месяц',yearly:'каждый год'}[r.freq]:`раз в ${iv} ${plural(iv,forms)}`;
  let s=every;
  if(r.freq==='weekly'){
    const days=(r.days||[]).slice().sort(),dl=days.map(i=>WD[i].toLowerCase()).join(', ');
    if(!r.par&&iv===1&&days.join()==='0,1,2,3,4')s='по будням';
    else if(r.par)s=`по ${r.par==='even'?'чётным':'нечётным'} неделям: ${dl}`;
    else if(days.length)s+=': '+dl;
  }
  if(r.freq==='monthly'){
    if(r.mmode==='nth'&&r.nth&&r.nth.length&&r.nthDays&&r.nthDays.length){
      const ns=nthSort(r.nth),ds=r.nthDays.slice().sort();
      if(ns.length===1&&ds.length===1){
        const g=WG[ds[0]],n=ns[0];
        const ord=n===-1?{m:'последний',f:'последнюю',n:'последнее'}[g]:n+{m:'-й',f:'-ю',n:'-е'}[g];
        s=iv===1?`${{m:'каждый',f:'каждую',n:'каждое'}[g]} ${ord} ${WACC[ds[0]]} месяца`:`${ord} ${WACC[ds[0]]}, ${every}`;
      }else s=`${every}: ${joinAnd(ns.map(n=>n===-1?'последний':n+'-й'))} ${ds.map(i=>WD[i].toLowerCase()).join(', ')}`;
    }else if(r.mdays&&r.mdays.length){
      const md=nthSort(r.mdays),nums=md.filter(x=>x>0),parts=[];
      if(nums.length)parts.push(nums.join(', ')+' числа');
      if(md.includes(-1))parts.push('последний день');
      s=`${every}: ${parts.join(' и ')}`;
    }
  }
  const ml=monthsLabel(r.months);
  if(ml)s+=` · ${ml}`;
  return s;
}

function migrateCats(d){
  if(d.settings.catsV2)return;
  const need=DEFCATS();
  for(const n of need){const ex=d.cats.find(c=>c.name.trim().toLowerCase()===n.name.toLowerCase());if(!ex)d.cats.push(n);}
  const order=need.map(n=>n.name.toLowerCase());
  d.cats.sort((a,b)=>{const x=order.indexOf(a.name.toLowerCase()),y=order.indexOf(b.name.toLowerCase());return (x<0?99:x)-(y<0?99:y);});
  for(const c of d.cats){const k=KNOWNCAT[c.name.trim().toLowerCase()];if(k){c.color=k[0];c.icon=k[1];}else if(!c.icon)c.icon='📌';}
  for(const it of d.items){const c=d.cats.find(x=>x.id===it.cat);if(c){it.color=c.color;it.icon=c.icon;}}
  d.settings.catsV2=true;
}

function isDone(it,k){return isRep(it)?(it.doneDates||[]).includes(k):!!it.done;}
function setDone(it,k,v){
  if(isRep(it)){it.doneDates=(it.doneDates||[]).filter(x=>x!==k);if(v)it.doneDates.push(k);
    if(it.doneDates.length>400)it.doneDates=it.doneDates.sort().slice(-400);}
  else{it.done=v;it.doneAt=v?Date.now():null;if(it.goalId)stepDoneChanged(it);}
}
function subDone(it,sid,k){return isRep(it)?((it.subDone||{})[k]||[]).includes(sid):!!(it.subs.find(s=>s.id===sid)||{}).done;}
function subCount(it,k){if(!it.subs||!it.subs.length)return null;let n=0;for(const s of it.subs)if(subDone(it,s.id,k))n++;return [n,it.subs.length];}

/* ============ шаги целей = задачи в календаре ============ */
const goalOf=it=>it&&it.goalId?S.items.find(g=>g.id===it.goalId&&g.type==='goal'):null;
const stepTask=(g,sid)=>S.items.find(i=>i.goalId===g.id&&i.stepId===sid);
/* актуальные дата и отметка шага берутся из его задачи */
function pullSteps(g){for(const st of g.subs||[]){const t=stepTask(g,st.id);if(t){st.date=t.date;st.done=!!t.done;}else if(st.date&&st.linked){st.date='';}}}
/* создать/обновить задачи для шагов с датой */
function syncGoalSteps(g){
  const keep=new Set();
  if(g.gmode==='steps')for(const st of g.subs||[]){
    if(!st.date)continue;keep.add(st.id);st.linked=true;
    let t=stepTask(g,st.id);
    if(!t){t={id:uid(),type:'task',goalId:g.id,stepId:st.id,time:'',end:'',repeat:{freq:'none',interval:1,days:[],until:''},prio:0,subs:[],notes:'',cd:false};S.items.push(t);}
    if(t.date!==st.date){t.date=st.date;delete t.origDate;t.moved=0;}
    Object.assign(t,{title:st.t,done:!!st.done,color:g.color,icon:g.icon||'🎯',cat:g.cat,remind:g.stepRemind??null});
  }
  for(const st of g.subs||[])if(!keep.has(st.id))delete st.linked;
  S.items=S.items.filter(i=>!(i.goalId===g.id&&!keep.has(i.stepId)));
}
/* отметили задачу-шаг — обновить цель */
function stepDoneChanged(t){
  const g=goalOf(t);if(!g)return;
  const st=(g.subs||[]).find(x=>x.id===t.stepId);if(st)st.done=!!t.done;
  const was=!!g.done;g.done=goalProgress(g)>=1;if(g.done&&!was){g.doneAt=Date.now();toast('Цель достигнута 🎉');}
  if(!g.done)g.doneAt=null;
}

/* ============ покупки к делам ============ */
const SHOP_DAYS=7;
const hasShop=it=>!!(it&&it.needShop&&(it.type==='task'||it.type==='event'));
const shopList=it=>hasShop(it)?(it.shop||[]):[];
const shopSum=it=>hasShop(it)&&+it.shopSum>0?+it.shopSum:0;
const money=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';
function shopBought(it,sid,k){return isRep(it)?((it.shopDone||{})[k]||[]).includes(sid):!!((it.shop||[]).find(x=>x.id===sid)||{}).done;}
function setBought(it,sid,k,v){
  if(isRep(it)){it.shopDone=it.shopDone||{};const a=(it.shopDone[k]||[]).filter(x=>x!==sid);if(v)a.push(sid);it.shopDone[k]=a;}
  else{const x=(it.shop||[]).find(x=>x.id===sid);if(x)x.done=v;}
}
const shopLeft=(it,k)=>shopList(it).filter(x=>!shopBought(it,x.id,k));
/* ближайшие дела в пределах недели, к которым ещё не всё куплено */
function shopDue(from){
  const out=[];
  for(const it of S.items){if(!hasShop(it)||it.shopRemind===false)continue;
    const k=nextOcc(it,from,true);if(!k||diffDays(from,k)>SHOP_DAYS)continue;
    const left=shopLeft(it,k);if(shopList(it).length&&!left.length)continue;
    out.push({it,k,left});}
  return out.sort((a,b)=>a.k.localeCompare(b.k));
}

/* траты только за текущую календарную неделю (пн–вс); выполненные не считаются */
function weekSpend(k=today()){
  const start=addDays(k,-dow(k)),rows=[];let total=0;
  for(let i=0;i<7;i++){const d=addDays(start,i);
    for(const it of S.items){const v=shopSum(it);if(!v||!occursOn(it,d)||isDone(it,d))continue;total+=v;rows.push({it,k:d,v});}}
  return {total,rows,start};
}
function weekName(start){
  const t0=addDays(today(),-dow(today())),n=Math.round(diffDays(t0,start)/7);
  const a=pdate(start),b=pdate(addDays(start,6));
  const range=a.getMonth()===b.getMonth()?`${a.getDate()}–${b.getDate()} ${MG[b.getMonth()]}`:`${a.getDate()} ${MG[a.getMonth()].slice(0,3)} – ${b.getDate()} ${MG[b.getMonth()].slice(0,3)}`;
  return {title:n===0?'Траты на эту неделю':n===1?'Траты на следующую неделю':n===-1?'Траты на прошлой неделе':'Траты за неделю',range};
}

/* ============ перенос ============ */
const canCarry=it=>{const c=S.settings.carry||'off';return !isRep(it)&&it.date&&!it.done&&((it.type==='task'&&c!=='off')||(it.type==='event'&&c==='all'));};
/* невыполненное из прошлых дней переезжает на сегодня */
function carryOver(){
  const t=today();let n=0;
  for(const it of S.items){if(!canCarry(it)||it.date>=t)continue;
    if(!it.origDate)it.origDate=it.date;it.date=t;it.moved=(it.moved||0)+1;n++;}
  return n;
}
/* перенести запись (или одно повторение) на другую дату */
function moveItem(it,k,to){
  if(!to)return;
  if(isRep(it)){
    it.skip=(it.skip||[]).filter(x=>x!==k).concat(k);
    const c=JSON.parse(JSON.stringify(it));
    Object.assign(c,{id:uid(),date:to,repeat:{freq:'none',interval:1,days:[],until:''},done:false,origDate:k,moved:1,fromId:it.id});
    delete c.doneDates;delete c.skip;delete c.subDone;
    if(c.shopDone){const b=(it.shopDone||{})[k]||[];c.shop=(c.shop||[]).map(x=>({...x,done:b.includes(x.id)}));delete c.shopDone;}
    c.subs=(c.subs||[]).map(s=>({...s,done:false}));
    S.items.push(c);
  }else{
    if(!it.origDate)it.origDate=it.date;
    it.date=to;it.moved=(it.moved||0)+1;it.done=false;
    if(it.origDate===to){delete it.origDate;it.moved=0;}
  }
  save();render();toast('Перенесено на '+relDay(to));
}

/* ============ привычки и цели ============ */
const isCheck=it=>it.type==='task'||it.type==='habit'||it.type==='event';
function habitStreak(it){
  let k=today(),n=0,first=true;
  for(let i=0;i<1500;i++){
    if(!it.date||k<it.date)break;
    if(occursOn(it,k)){
      if(isDone(it,k))n++;
      else if(!first)break;
      first=false;
    }
    k=addDays(k,-1);
  }
  return n;
}
function habitRate(it){
  const t=today(),m=t.slice(0,8)+'01';let k=it.date>m?it.date:m,all=0,done=0;
  while(k<=t){if(occursOn(it,k)){all++;if(isDone(it,k))done++;}k=addDays(k,1);}
  return all?Math.round(done/all*100):null;
}
function goalProgress(it){
  if(it.gmode==='num')return it.target>0?Math.min(1,(+it.cur||0)/it.target):0;
  const n=(it.subs||[]).length;return n?it.subs.filter(s=>s.done).length/n:(it.done?1:0);
}
const fmtNum=n=>(+n||0).toLocaleString('ru-RU',{maximumFractionDigits:2});
function goalText(it){
  if(it.gmode==='num')return `${fmtNum(it.cur)} из ${fmtNum(it.target)}${it.unit?' '+esc(it.unit):''}`;
  const n=(it.subs||[]).length,d=(it.subs||[]).filter(s=>s.done).length;
  return n?`${d} из ${n} ${plural(n,['шага','шагов','шагов'])}`:'шаги не добавлены';
}
/* ближайшая дата записи для «Скоро» и «Отсчёта» */
function nextDateFor(it,from){
  if(it.type==='goal')return it.due&&!it.done&&it.due>=from?it.due:null;
  return nextOcc(it,from,isCheck(it));
}

/* ============ люди ============ */
function bdDate(p,year){if(!p.bd||!p.bd.m||!p.bd.d)return null;const day=Math.min(p.bd.d,dim(year,p.bd.m-1));return `${year}-${pad(p.bd.m)}-${pad(day)}`;}
function bdayOn(p,k){return !!p.bd&&bdDate(p,pdate(k).getFullYear())===k;}
function nextBday(p,from){if(!p.bd||!p.bd.m)return null;const y=pdate(from).getFullYear();let k=bdDate(p,y);if(k<from)k=bdDate(p,y+1);return k;}
function ageOn(p,k){return p.bd&&p.bd.y?pdate(k).getFullYear()-p.bd.y:null;}
const initials=n=>n.trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const section=(title,body,cls='',extra='')=>`<div class="sec ${cls}"><h2>${title}${extra}</h2><div class="card">${body}</div></div>`;
const empty=t=>`<div class="empty">${t}</div>`;

function metaFor(it,k,showDate){
  const m=[];
  if(it.goalId){const g=goalOf(it);if(g)m.push(`<span class="goalm">🎯 ${esc(g.title)}</span>`);}
  const ct=catOf(it);if(ct)m.push(`<span class="cat" style="--cc:${ct.color}">${esc(ct.name)}</span>`);
  if(showDate&&k){const n=diffDays(today(),k);m.push(`<span class="${n<0&&!isDone(it,k)?'late':''}">${relDay(k)}</span>`);}
  if(it.type==='event')m.push(it.time?esc(it.time+(it.end?'–'+it.end:'')):'весь день');
  else if(it.time)m.push(esc(it.time));
  if(it.type==='habit'){const st=habitStreak(it);if(st>0)m.push(`🔥 ${st}`);}
  if(isRep(it))m.push('↻ '+repLabel(it.repeat));
  const sc=subCount(it,k);if(sc)m.push(`☑ ${sc[0]}/${sc[1]}`);
  const sv=shopSum(it);if(sv)m.push(`<span class="shopm">💳 ${money(sv)}</span>`);
  const sl=shopList(it);if(sl.length&&k){const b=sl.length-shopLeft(it,k).length;m.push(`<span class="${b<sl.length?'shopm':''}">🛒 ${b}/${sl.length}</span>`);}
  if(it.remind!=null&&it.remind!=='')m.push('🔔');
  if(it.cd)m.push('⏳');
  if(it.moved&&!isRep(it)&&it.origDate&&it.origDate!==it.date)m.push(`<span class="moved">↷ с ${dayMonth(it.origDate)}</span>`);
  if(it.notes&&!m.length)m.push(esc(it.notes.split('\n')[0]).slice(0,60));
  return m.map(x=>x.startsWith('<span')?x:`<span>${x}</span>`).join('');
}
function row(it,k,showDate){

const rank=it=>it.type==='event'&&!it.time?0:it.time?1:2;
const cmp=(a,b)=>rank(a)-rank(b)||(a.time||'').localeCompare(b.time||'')||(b.prio||0)-(a.prio||0)||a.title.localeCompare(b.title,'ru');

function bdayRow(p,k){

function dayBlock(k,label){
  const its=itemsOn(k).filter(it=>it.type!=='habit'), bd=S.people.filter(p=>bdayOn(p,k));
  let b=its.map(it=>row(it,k)).join('')+bd.map(p=>bdayRow(p,k)).join('');
  return section(label,b||empty('Ничего не запланировано'));

function vToday(){
  const k=today(), its=itemsOn(k);
  const tasks=its.filter(i=>i.type==='task'), left=tasks.filter(i=>!isDone(i,k)).length, ev=its.filter(i=>i.type==='event').length;
  const hb=its.filter(i=>i.type==='habit'), hl=hb.filter(i=>!isDone(i,k)).length;
  let sm=[];
  if(ev)sm.push(`${ev} ${plural(ev,['событие','события','событий'])}`);
  if(tasks.length)sm.push(left?`${left} ${plural(left,['задача','задачи','задач'])} осталось`:'все задачи сделаны ✨');
  if(hb.length)sm.push(hl?`${hl} ${plural(hl,['привычка','привычки','привычек'])}`:'привычки выполнены 🔥');
  let h=`<div class="hero"><div class="wd">${WDL[dow(k)]}</div><div class="dm">${dayMonth(k)}</div><div class="sm">${sm.join(' · ')||'Свободный день'}</div></div>`;

    h+=`<div class="tip"><b>Добро пожаловать</b>Нажмите «+», чтобы добавить задачу или событие. На вкладке «Люди» можно записать дни рождения близких. Все данные хранятся только на этом телефоне.</div>`;
  const over=S.items.filter(it=>it.type==='task'&&!isRep(it)&&it.date&&it.date<k&&!it.done).sort((a,b)=>a.date.localeCompare(b.date));
  if(over.length)h+=section('Просрочено',over.map(it=>row(it,it.date,true).replace(/<\/div>$/,`<button class="btn sm" data-act="quickmove" data-id="${it.id}" data-k="${it.date}">На сегодня</button></div>`)).join(''),'warn',`<span class="n">${over.length}</span>`);
  h+=dayBlock(k,'План на сегодня');
  const sd=shopDue(k);
  if(sd.length)h+=section('Скоро покупки',sd.map(({it,k:d,left})=>{const n=diffDays(k,d),sv=shopSum(it);
    const title=left.length?left.map(x=>x.t).join(', '):it.title;

  if(hb.length)h+=section('Привычки',hb.map(it=>row(it,k)).join(''),'',`<span class="n">${hb.length-hl} из ${hb.length}</span>`);
  h+=dayBlock(addDays(k,1),'Завтра');
  h+=soonBlock(k);
  return h;
}

/* Блок «Скоро»: дни рождения и события с отсчётом на ближайшие 30 дней (после «Завтра») */
function soonBlock(k){
  const from=addDays(k,2), e=[];
  for(const p of S.people){const d=nextBday(p,from);if(!d||diffDays(k,d)>30)continue;const a=ageOn(p,d);
    e.push({d,html:`<span class="ava" style="background:${p.color||COLORS[6]}">${esc(initials(p.name))}</span>`,
      t:`🎂 ${esc(p.name)}`,m:`${dayMonth(d)}${a!=null?` · исполнится ${a} ${plural(a,['год','года','лет'])}`:''}`,act:`data-act="person" data-pid="${p.id}"`});}
  for(const it of S.items){if(!it.cd)continue;const d=nextDateFor(it,from);if(!d||diffDays(k,d)>30)continue;
    e.push({d,html:`<span class="ava" style="background:${it.color||COLORS[0]};font-size:20px">${esc(it.icon||'⏳')}</span>`,
      t:esc(it.title),m:it.type==='goal'?`🎯 дедлайн ${dayMonth(d)} · ${goalText(it)}`:`${WDL[dow(d)]}, ${dayMonth(d)}${it.time?' в '+esc(it.time):''}`,act:`data-act="edit" data-id="${it.id}" data-k="${d}"`});}
  if(!e.length)return '';
  e.sort((a,b)=>a.d.localeCompare(b.d));
  return section('Скоро',e.slice(0,6).map(x=>{const n=diffDays(k,x.d);
    return `<div class="row" ${x.act}>${x.html}<div class="txt"><div class="t">${x.t}</div><div class="m"><span>${x.m}</span></div></div><span class="badge">через ${n} ${plural(n,['день','дня','дней'])}</span></div>`;}).join(''));
}

let tf='active', tcat='all';
function vTasks(){
  const t=today();
  if(tcat!=='all'&&tcat!=='none'&&!S.cats.some(c=>c.id===tcat))tcat='all';
  const tasks=S.items.filter(i=>i.type==='task'&&(tcat==='all'||(tcat==='none'?!catOf(i):i.cat===tcat)));
  let h=`<div class="seg" style="margin:4px 0 6px"><button class="${tf==='active'?'on':''}" data-act="tf" data-f="active">Активные</button><button class="${tf==='done'?'on':''}" data-act="tf" data-f="done">Выполненные</button></div>`;
  h+=`<div class="catbar"><button class="chip ${tcat==='all'?'on':''}" data-act="tcat" data-id="all">Все</button>${S.cats.map(c=>`<button class="chip ${tcat===c.id?'on':''}" data-act="tcat" data-id="${c.id}">${esc(c.icon||'')} ${esc(c.name)}</button>`).join('')}<button class="chip ${tcat==='none'?'on':''}" data-act="tcat" data-id="none">Без категории</button></div>`;
  if(tf==='done'){
    const d=tasks.filter(i=>!isRep(i)&&i.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)).slice(0,150);
    const r=tasks.filter(i=>isRep(i)&&(i.doneDates||[]).length).map(i=>[i,(i.doneDates||[]).slice().sort().pop()]).sort((a,b)=>b[1].localeCompare(a[1]));
    h+=section('Разовые',d.length?d.map(i=>row(i,i.date,!!i.date)).join(''):empty('Пока пусто'));
    if(r.length)h+=section('Повторяющиеся — последний раз',r.map(([i,k])=>row(i,k,true)).join(''));
    return h;
  }
  const g={over:[],nodate:[],today:[],week:[],later:[]};
  for(const it of tasks){
    if(!it.date){if(!it.done)g.nodate.push([it,'']);continue;}
    if(!isRep(it)){if(it.done)continue;const n=diffDays(t,it.date);(n<0?g.over:n===0?g.today:n<=7?g.week:g.later).push([it,it.date]);continue;}
    const k=nextOcc(it,t,true);if(!k)continue;const n=diffDays(t,k);(n===0?g.today:n<=7?g.week:g.later).push([it,k]);
  }
  const srt=a=>a.sort((x,y)=>(x[1]||'').localeCompare(y[1]||'')||cmp(x[0],y[0]));
  const blk=(title,arr,cls,show=true)=>arr.length?section(title,srt(arr).map(([i,k])=>row(i,k,show&&!!k)).join(''),cls,`<span class="n">${arr.length}</span>`):'';
  h+=blk('Просрочено',g.over,'warn')+blk('Сегодня',g.today,'',false)+blk('Ближайшая неделя',g.week)+blk('Позже',g.later)+blk('Без даты',g.nodate);
  if(!Object.values(g).some(a=>a.length))h+=section('Задачи',empty('Активных задач нет. Нажмите «+», чтобы добавить.'));
  return h;
}

let gtab='habits';
function vGoals(){
  const t=today();
  let h=`<div class="seg" style="margin:4px 0 12px"><button class="${gtab==='habits'?'on':''}" data-act="gtab" data-g="habits">Привычки</button><button class="${gtab==='goals'?'on':''}" data-act="gtab" data-g="goals">Цели</button></div>`;
  if(gtab==='habits'){
    const hs=S.items.filter(i=>i.type==='habit');
    if(!hs.length)return h+section('Привычки',empty('Привычка повторяется по расписанию. Отмечайте её каждый раз, и здесь появится серия 🔥 и процент выполнения. Нажмите «+».'));
    const days=Array.from({length:7},(_,i)=>addDays(t,i-6));
    const act=hs.filter(i=>!i.repeat.until||i.repeat.until>=t), old=hs.filter(i=>i.repeat.until&&i.repeat.until<t);
    const card=it=>{
      const st=habitStreak(it),rate=habitRate(it),c=it.color||COLORS[0],sched=occursOn(it,t),done=isDone(it,t);
      const strip=days.map(k=>{const on=occursOn(it,k),dn=on&&isDone(it,k);
        return `<button class="hd ${!on?'off':dn?'dn':k<t?'miss':''} ${k===t?'now':''}" style="--c:${c}" data-act="htog" data-id="${it.id}" data-k="${k}"><span>${WD[dow(k)]}</span><b>${pdate(k).getDate()}</b></button>`;}).join('');
      return `<div class="hab" data-act="edit" data-id="${it.id}" data-k="${t}"><div class="hrow">${it.icon?`<span class="ico">${esc(it.icon)}</span>`:''}<div class="txt"><div class="t">${esc(it.title)}</div><div class="m"><span>${repLabel(it.repeat)}</span>${rate!=null?`<span>${rate}% за месяц</span>`:''}</div></div><span class="streak ${st?'':'zero'}">🔥 ${st}</span>${sched?`<button class="chk ${done?'on':''}" style="--c:${c};width:30px;height:30px" data-act="toggle" data-id="${it.id}" data-k="${t}"></button>`:''}</div><div class="strip">${strip}</div></div>`;
    };
    h+=`<div class="card">${act.map(card).join('')}</div>`;
    if(old.length)h+=section('Завершённые',old.map(card).join(''));
    return h;
  }
  const gs=S.items.filter(i=>i.type==='goal');
  if(!gs.length)return h+section('Цели',empty('Цель можно разбить на шаги или отслеживать числом: «накопить 50 000 ₽», «прочитать 12 книг». Нажмите «+».'));
  const card=it=>{
    pullSteps(it);
    const pr=goalProgress(it),c=it.color||COLORS[0],m=[goalText(it)];
    if(it.gmode==='steps'&&!it.done){const nx=(it.subs||[]).filter(x=>!x.done&&x.date).sort((a,b)=>a.date.localeCompare(b.date))[0];if(nx)m.push(`<span class="${nx.date<today()?'late':''}">→ ${esc(nx.t)}, ${relDay(nx.date)}</span>`);}
    if(it.due&&!it.done){const n=diffDays(t,it.due);m.push(n<0?`<span class="late">дедлайн прошёл ${dayMonth(it.due)}</span>`:n===0?'<span class="late">дедлайн сегодня</span>':`до ${dayMonth(it.due)} · ${n} ${plural(n,['день','дня','дней'])}`);}
    else if(it.done&&it.doneAt)m.push('достигнута '+relDay(dkey(new Date(it.doneAt))));
    return `<div class="row goal" data-act="edit" data-id="${it.id}"><span class="ava" style="background:${c};font-size:20px">${esc(it.icon||'🎯')}</span><div class="txt"><div class="t">${esc(it.title)}</div><div class="m">${m.map(x=>x.startsWith('<span')?x:`<span>${x}</span>`).join('')}</div><div class="pbar"><i style="width:${Math.round(pr*100)}%;background:${c}"></i></div></div><span class="pct">${Math.round(pr*100)}%</span>${it.gmode==='num'&&!it.done?`<button class="btn sm" data-act="gadd" data-id="${it.id}">+</button>`:''}</div>`;
  };
  const act=gs.filter(i=>!i.done).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')), fin=gs.filter(i=>i.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  if(act.length)h+=`<div class="card">${act.map(card).join('')}</div>`;
  else h+=section('В работе',empty('Все цели достигнуты 🎉'));
  if(fin.length)h+=section('Достигнутые',fin.map(card).join(''));
  return h;
}

function syncRepUI(){

  }

  show('.rep-mday',R.mmode!=='nth');
  show('.rep-nth',R.mmode==='nth');
  show('.rep-months',season);
  show('.rep-hint',f!=='none'&&edit.type==='task');

  mark('wday','i',R.days);mark('mday','d',R.mdays);mark('nth','n',R.nth);mark('nthday','i',R.nthDays);mark('rmonth','m',R.months);
  document.querySelectorAll('#ef [data-act="mmode"]').forEach(b=>b.classList.toggle('on',b.dataset.m===(R.mmode||'day')));

function readRepeat(f){
  const R=edit.repeat,until=$('#f-until').value||'',months=$('#f-season').checked?R.months.slice().sort((a,b)=>a-b):[];
  if(f==='none')return {freq:'none',interval:1,days:[],until:''};
  if(f==='workdays')return {freq:'weekly',interval:1,days:[0,1,2,3,4],until,par:'',months};
  const o={freq:f,interval:Math.max(1,Math.min(999,parseInt($('#f-int').value)||1)),until,months,days:[]};
  if(f==='weekly'){o.days=R.days.slice().sort();o.par=$('#f-par').value;if(o.par)o.interval=1;}
  if(f==='monthly'){o.mmode=R.mmode==='nth'?'nth':'day';
    if(o.mmode==='nth'){o.nth=nthSort(R.nth);o.nthDays=R.nthDays.slice().sort();}
    else o.mdays=nthSort(R.mdays);}
  return o;
}
function updPrev(){
  const el=$('#rep-prev');if(!el)return;
  const f=$('#f-freq').value;if(f==='none'){el.innerHTML='';return;}
  const start=$('#f-date').value||today(),tmp={date:start,repeat:readRepeat(f)},out=[],ty=pdate(today()).getFullYear();
  let k=start<today()?today():start;
  for(let i=0;i<6;i++){const n=nextOcc(tmp,k,false);if(!n)break;out.push(n);k=addDays(n,1);}
  el.innerHTML=`<div class="rp-l">↻ ${esc(repLabel(tmp.repeat))}</div>`+(out.length
    ?`<div class="rp-d">Ближайшие: ${out.map(x=>`${WD[dow(x)].toLowerCase()} ${dayMonth(x)}${pdate(x).getFullYear()!==ty?' '+pdate(x).getFullYear():''}`).join(' · ')}</div>`
    :'<div class="rp-d late">Под эти условия не попадает ни одна дата</div>');
}
function readShop(it,k){
  const list=[],bought=[];
  document.querySelectorAll('#shops .sub').forEach(el=>{const t=el.querySelector('input').value.trim();if(!t)return;
    const id=el.dataset.sid,on=el.querySelector('.chk').classList.contains('on');list.push({id,t,done:isRep(it)?false:on});if(on)bought.push(id);});
  it.shop=list;it.needShop=$('#f-needshop').checked;
  const sv=parseFloat($('#f-shopsum').value);it.shopSum=sv>0?sv:null;it.shopRemind=$('#f-shoprem').checked;
  if(!it.needShop){it.shopSum=null;}
  if(isRep(it)&&k){it.shopDone=it.shopDone||{};it.shopDone[k]=bought;}
  if(!it.needShop){delete it.shopDone;}
}
function readSubs(it,k){
  const subs=[],doneIds=[];
  document.querySelectorAll('#subs .sub').forEach(el=>{const t=el.querySelector('input').value.trim();if(!t)return;
    const id=el.dataset.sid,on=el.querySelector('.chk').classList.contains('on');const o={id,t,done:isRep(it)?false:on};
    if(it.type==='goal'){const dv=el.querySelector('.sdate').value;if(dv)o.date=dv;const old=(edit.subs||[]).find(x=>x.id===id);if(old&&old.linked)o.linked=true;}
    subs.push(o);if(on)doneIds.push(id);});
  it.subs=subs;
  if(isRep(it)&&k){it.subDone=it.subDone||{};it.subDone[k]=doneIds;}
}
function saveItem(){
  const title=$('#f-title').value.trim();
  if(!title){toast('Введите название');$('#f-title').focus();return;}
  const it=edit;it.title=title;
  const r=$('#f-rem').value;it.remind=r===''?null:+r;
  it.notes=$('#f-notes').value.trim();
  it.cd=it.type!=='habit'&&$('#f-cd').checked;
  if(it.type==='goal'){
    it.date='';it.time='';it.end='';it.repeat={freq:'none',interval:1,days:[],until:''};it.prio=0;
    delete it.doneDates;delete it.subDone;delete it.skip;
    it.due=$('#f-due').value||'';
    if(it.gmode==='num'){
      const tg=parseFloat($('#f-target').value);
      if(!(tg>0)){toast('Укажите, сколько нужно набрать');$('#f-target').focus();return;}
      it.target=tg;it.cur=Math.max(0,parseFloat($('#f-cur').value)||0);it.unit=$('#f-unit').value.trim();
    }else{readSubs(it,'');const sr=$('#f-srem').value;it.stepRemind=sr===''?null:+sr;}
    const was=!!it.done;it.done=goalProgress(it)>=1;
    if(it.done&&!was){it.doneAt=Date.now();}
  }else{
    delete it.due;
    it.date=$('#f-date').value||'';it.time=$('#f-time').value||'';it.end=it.type==='event'?($('#f-end').value||''):'';
    if(it.type!=='task'&&!it.date)it.date=today();
    let f=$('#f-freq').value;
    if(it.type==='habit'&&f==='none')f='daily';
    if(f==='none')it.repeat={freq:'none',interval:1,days:[],until:''};
    else{
      if(!it.date)it.date=today();
      const rr=readRepeat(f);
      if(!nextOcc({date:it.date,repeat:rr},it.date,false)){toast('Под эти условия не попадает ни одна дата');return;}
      it.repeat=rr;
    }
    if(!isRep(it)){delete it.doneDates;delete it.subDone;delete it.skip;}
    if(it.type==='task'||it.type==='event')readShop(it,editCtx.k||it.date);
    else{it.needShop=false;it.shop=[];delete it.shopDone;}
    if(it.type==='task')readSubs(it,editCtx.k||it.date);
    else{it.subs=[];it.prio=0;delete it.subDone;}
  }
  {const c=catOf(it);if(c){it.color=c.color;it.icon=c.icon||'';}else{it.color=NOCAT;it.icon=it.type==='goal'?'🎯':'';}}
  const i=S.items.findIndex(x=>x.id===it.id);
  if(i>=0)S.items[i]=it;else S.items.push(it);
  if(it.type==='goal')syncGoalSteps(it);
  if(it.goalId){const g=goalOf(it),st=g&&(g.subs||[]).find(x=>x.id===it.stepId);if(st){st.t=it.title;st.date=it.date;if(!it.date){delete st.linked;S.items=S.items.filter(x=>x.id!==it.id);}stepDoneChanged(it);}}
  save();closeSheet();render();toast(editCtx.isNew?'Добавлено':'Сохранено');
}
async function deleteItem(){
  const it=S.items.find(i=>i.id===edit.id);if(!it){closeSheet();return;}
  const k=editCtx.k;
  let v;
  if(isRep(it)&&k)v=await ask('Удалить повторяющуюся запись?','',[{label:`Только ${relDay(k)}`,value:'one'},{label:'Эту и все следующие',value:'after',cls:'danger'},{label:'Всю серию',value:'all',cls:'danger'}]);
  else v=await ask('Удалить запись?',it.type==='goal'&&S.items.some(x=>x.goalId===it.id)?it.title+' — вместе с её шагами в календаре':it.goalId?it.title+' — шаг останется в цели, но без даты':it.title,[{label:'Удалить',value:'all',cls:'danger'}]);
  if(!v)return;
  if(v==='one'){it.skip=(it.skip||[]).concat(k);}
  else if(v==='after'){if(k<=it.date)S.items=S.items.filter(x=>x.id!==it.id);else it.repeat.until=addDays(k,-1);}
  else{
    S.items=S.items.filter(x=>x.id!==it.id);
    if(it.type==='goal')S.items=S.items.filter(x=>x.goalId!==it.id);
    if(it.goalId){const g=goalOf(it),st=g&&(g.subs||[]).find(x=>x.id===it.stepId);if(st){st.date='';delete st.linked;}}
  }
  save();render();toast('Удалено');
}

/* ============ уведомления ============ */
function relFrom(fireMs,k){
  const n=diffDays(dkey(new Date(fireMs)),k);
  return n===0?'сегодня':n===1?'завтра':n===2?'послезавтра':`${WDL[dow(k)]}, ${dayMonth(k)}`;
}
function remText(it,k,t){
  const d=relFrom(t,k), when=(d[0].toUpperCase()+d.slice(1))+(it.time?` в ${it.time}`:'');
  return when+(it.notes?' · '+it.notes.split('\n')[0].slice(0,80):'');
}
function buildAlarms(){
  const out=[],now=Date.now(),s=S.settings,k0=today(),H=60;
  for(let i=0;i<H;i++){
    const k=addDays(k0,i);
    for(const it of S.items){
      if(it.remind==null||it.remind===''||!occursOn(it,k))continue;
      if(isCheck(it)&&isDone(it,k))continue;
      const t=it.time?atMs(k,it.time)-it.remind*60000:(it.remind>=1440?atMs(k,s.morning)-it.remind*60000:atMs(k,s.morning));
      if(t>now)out.push({id:hid('i'+it.id+k),at:t,ch:'rem',title:(it.icon?it.icon+' ':'')+it.title,text:remText(it,k,t)});
    }
    if(s.nBday)for(const p of S.people)if(bdayOn(p,k)){const t=atMs(k,s.morning),a=ageOn(p,k);
      if(t>now)out.push({id:hid('b'+p.id+k),at:t,ch:'day',title:'🎂 День рождения',text:p.name+(a!=null?` — исполняется ${a} ${plural(a,['год','года','лет'])}`:'')});}
    for(const it of S.items){if(!hasShop(it)||it.shopRemind===false||!occursOn(it,k)||isDone(it,k))continue;
      const left=shopLeft(it,k);if(shopList(it).length&&!left.length)continue;
      const t=atMs(addDays(k,-SHOP_DAYS),s.morning),sv=shopSum(it);
      const txt=[left.length?'Нужно купить: '+left.map(x=>x.t).join(', '):'',sv?'Сумма: '+money(sv):''].filter(Boolean).join(' · ')||'Запланирована покупка';
      if(t>now)out.push({id:hid('s'+it.id+k),at:t,ch:'day',title:`🛒 Через неделю: ${it.title}`,text:txt});}
    if(s.agenda){const its=itemsOn(k).filter(it=>!(isCheck(it)&&isDone(it,k)));const t=atMs(k,s.agendaTime);
      if(its.length&&t>now)out.push({id:hid('a'+k),at:t,ch:'day',title:`План на сегодня: ${its.length} ${plural(its.length,['пункт','пункта','пунктов'])}`,text:its.slice(0,6).map(it=>(it.time?it.time+' ':'')+it.title).join(' · ')});}
  }
  for(const it of S.items){if(it.type!=='goal'||it.done||!it.due||it.remind==null||it.remind==='')continue;
    const t=atMs(it.due,s.morning)-(it.remind>=1440?it.remind*60000:0);
    if(t>now&&diffDays(k0,it.due)<=H)out.push({id:hid('g'+it.id+it.due),at:t,ch:'rem',title:'🎯 '+it.title,text:`Дедлайн ${relFrom(t,it.due)} · ${goalText(it)}`});}
  out.sort((a,b)=>a.at-b.at);
  return out.slice(0,300);
}

    case 'notime':$('#f-time').value='';if($('#f-end'))$('#f-end').value='';break;
    case 'wday':toggleIn(edit.repeat.days,+d.i);syncRepUI();break;
    case 'mday':toggleIn(edit.repeat.mdays,+d.d);syncRepUI();break;
    case 'nth':toggleIn(edit.repeat.nth,+d.n);syncRepUI();break;
    case 'nthday':toggleIn(edit.repeat.nthDays,+d.i);syncRepUI();break;
    case 'rmonth':toggleIn(edit.repeat.months,+d.m);syncRepUI();break;
    case 'mmode':edit.repeat.mmode=d.m;syncRepUI();break;
    case 'prio':edit.prio=+d.i;el.parentNode.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b===el));break;
    case 'color':edit.color=d.c;el.parentNode.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',b===el));break;
    case 'icon':edit.icon=d.e;el.parentNode.querySelectorAll('.emo').forEach(b=>b.classList.toggle('on',b===el));break;
    case 'addsub':{const w=document.createElement('div');w.innerHTML=subRow({id:uid(),t:''},false);const n=w.firstChild;$('#subs').appendChild(n);n.querySelector('input').focus();break;}
    case 'subchk':el.classList.toggle('on');break;
    case 'addshop':{const w=document.createElement('div');w.innerHTML=shopRow({id:uid(),t:''},false);const n=w.firstChild;$('#shops').appendChild(n);n.querySelector('input').focus();break;}
    case 'shop':openShop(d.id,d.k);break;
    case 'spend':openSpend();break;
    case 'buy':{e.stopPropagation();if(!shopCtx)break;const it=S.items.find(i=>i.id===shopCtx.id);if(!it)break;
      setBought(it,d.sid,shopCtx.k,!shopBought(it,d.sid,shopCtx.k));save();$('#shoplist').innerHTML=shopCtx.rows();render();
      if(!shopLeft(it,shopCtx.k).length)toast('Всё куплено 🎉');break;}
    case 'shopedit':{const c=shopCtx;sheetOnClose=null;closeSheet();setTimeout(()=>openItem(c.id,{},c.k),230);break;}
    case 'delsub':el.closest('.sub').remove();break;
    case 'saveitem':saveItem();break;
    case 'delitem':deleteItem();break;
    case 'pcolor':pedit.color=d.c;el.parentNode.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',b===el));break;
    case 'saveperson':savePerson();break;
    case 'delperson':deletePerson();break;
    case 'savesettings':saveSettings();break;
    case 'checkupd':toast('Проверяю…');Native.checkUpdate();break;
    case 'openapk':Native.openApk();break;
    case 'applyupd':$('#updbar').classList.add('hide');try{Native.reload();}catch(e){location.reload();}break;
    case 'testnotif':if(window.Native&&Native.test){Native.test();toast('Уведомление придёт через 5 секунд');}else toast('Уведомления работают только в приложении на телефоне');break;
    case 'export':doExport();break;
    case 'importfile':$('#s-file').click();break;
    case 'importtext':importText();break;
    case 'doimport':doImport($('#imp').value);break;
    case 'wipe':ask('Стереть все данные?','Это нельзя отменить. Сначала сделайте резервную копию.',[{label:'Стереть всё',value:'y',cls:'danger'}]).then(v=>{if(!v)return;S=blank();applyTheme();save();render();toast('Данные удалены');});break;
  }
});
document.addEventListener('input',e=>{const p=e.target.dataset&&e.target.dataset.ncf;if(!p||!NF[p]||NF[p].picked)return;NF[p].icon=guessIcon(e.target.value)||'📌';nfRefresh(p);});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;
  if(e.target.id==='f-title'){e.preventDefault();e.target.blur();}
  if(e.target.id==='nc-name'){e.preventDefault();$('[data-act="addcat"]').click();}
  if(e.target.id==='cm-name'){e.preventDefault();$('[data-act="cmadd"]').click();}
  if(e.target.id==='ce-name'){e.preventDefault();$('[data-act="cedone"]').click();}});

/* кнопка «Назад» на Android */
window.__back=()=>{if(sheetOpen){closeSheet();return true;}if(tab!=='today'){tab='today';render();return true;}return false;};
/* возврат в приложение: обновить «сегодня» и перепланировать */
let lastDay=today();
window.__resume=()=>{if(today()!==lastDay){lastDay=today();cal.sel=cal.cur=today();}if(carryOver())save();if(!sheetOpen)render();scheduleNow();};
setInterval(()=>{if(today()!==lastDay)window.__resume();},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)window.__resume();});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);

/* обновления интерфейса */
window.__updateReady=()=>{$('#updbar').classList.remove('hide');};
window.__updateResult=r=>{if(r===1){closeSheet();window.__updateReady();}else if(r===0)toast('У вас последняя версия');else toast('Не удалось проверить — нет интернета?');};

if(carryOver())save();
applyTheme();render();scheduleNow();
try{if(window.Native&&Native.ready)Native.ready();}catch(e){}
</script>
</body>
</html>
