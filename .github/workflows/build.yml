name: Собрать APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Сборка
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Переименовать
        run: cp app/build/outputs/apk/release/app-release.apk Blizko.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Blizko-APK
          path: Blizko.apk
