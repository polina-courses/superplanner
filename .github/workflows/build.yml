name: Собрать APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Сборка
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Переименовать
        run: cp app/build/outputs/apk/release/app-release.apk Blizko.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Blizko-APK
          path: Blizko.apk
      - name: Выложить по постоянной ссылке
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk Blizko.apk --target "$GITHUB_SHA" --latest \
            --title "Близко — последняя версия" \
            --notes "Скачать: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/Blizko.apk"
