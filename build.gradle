plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.polina.blizko'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.polina.blizko'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // Постоянный ключ подписи: благодаря ему новые версии ставятся поверх старой без потери данных.
    signingConfigs {
        personal {
            storeFile file('blizko.jks')
            storePassword 'blizko-personal'
            keyAlias 'blizko'
            keyPassword 'blizko-personal'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.personal
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.personal
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
